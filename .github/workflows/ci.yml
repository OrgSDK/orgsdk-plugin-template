name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # actions/checkout@v4 — full history so the version guard can diff
      # against the PR base / previous main commit (robust to shallow clones).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      # oven-sh/setup-bun@v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version guard (manifest version bumps with publishable content)
        env:
          # pull_request: diff against the base branch tip (origin/<base>).
          # push: diff against the previous commit on this branch.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
        run: |
          # Ensure the base ref is present in the local clone (PR checkouts may
          # not fetch the base branch tip by default). Best-effort; the guard
          # no-ops gracefully if the ref still cannot be resolved.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}" 2>/dev/null || true
          fi
          bun run version-guard

      - name: Format + lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Validate (manifest + source purity)
        run: bun run validate

      - name: Package artifact
        run: bun run package

      # actions/upload-artifact@v4
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plugin-template-${{ github.sha }}
          path: dist/
          retention-days: 14
